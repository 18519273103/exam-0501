<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高校选课管理系统</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f4f6fb;
            color: #1f2937;
        }

        .container {
            max-width: 1100px;
            margin: 32px auto;
            padding: 0 20px;
        }

        .header {
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .header p {
            margin: 0;
            color: #6b7280;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
        }

        .card h2 {
            margin: 0 0 14px;
            font-size: 20px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-top: 12px;
        }

        button, input, select {
            height: 38px;
            border-radius: 7px;
            border: 1px solid #d1d5db;
            padding: 0 12px;
            font-size: 14px;
        }

        button {
            border: none;
            background: #2563eb;
            color: #fff;
            cursor: pointer;
        }

        button.secondary {
            background: #4b5563;
        }

        button:hover {
            opacity: 0.9;
        }

        .hint, .message {
            font-size: 13px;
            color: #6b7280;
        }

        .message {
            color: #2563eb;
            min-height: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 14px;
        }

        th, td {
            padding: 11px 10px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f9fafb;
        }

        .empty {
            text-align: center;
            color: #6b7280;
            padding: 24px;
        }

        .tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 999px;
            background: #e0ecff;
            color: #1d4ed8;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>高校选课管理系统</h1>
        <p>CSV 批量导入选课数据，提交至 Spring Boot 后端处理后回显展示。</p>
    </div>

    <section class="card">
        <h2>① 数据批量导入</h2>
        <textarea id="csvInput" placeholder="每行一条 CSV 数据，例如：&#10;S000001,C000001,Java程序设计,专业课&#10;S000002,C000003,计算机网络,公共课">S000001,C000001,Java程序设计,专业课
S000002,C000003,计算机网络,公共课
S000003,C000002,高等数学,
S000001,C000001,Java程序设计进阶,专业课</textarea>
        <p class="hint">格式：学生ID,课程ID,课程名称,课程类型。课程类型可为空，后端会根据课程名称自动分类。</p>
        <div class="toolbar">
            <button type="button" onclick="importRecords()">导入按钮</button>
            <button type="button" class="secondary" onclick="loadRecords()">刷新数据</button>
            <span id="message" class="message"></span>
        </div>
    </section>

    <section class="card">
        <h2>② 数据展示</h2>
        <div class="toolbar">
            <input id="keyword" type="text" placeholder="输入学生ID、课程ID或课程名称">
            <select id="courseType">
                <option value="">全部课程类型</option>
                <option value="公共课">公共课</option>
                <option value="专业课">专业课</option>
                <option value="选修课">选修课</option>
                <option value="未知类型">未知类型</option>
            </select>
            <button type="button" onclick="loadRecords()">查询展示</button>
        </div>

        <table>
            <thead>
            <tr>
                <th>学生ID</th>
                <th>课程ID</th>
                <th>课程名称</th>
                <th>课程类型</th>
            </tr>
            </thead>
            <tbody id="recordTable">
            <tr><td class="empty" colspan="4">页面加载中...</td></tr>
            </tbody>
        </table>
    </section>
</div>

<script>
    const API_PREFIXES = ['/api/enroll', ''];
    const sampleRecords = [
        { studentId: 'S000001', courseId: 'C000001', courseName: 'Java程序设计', courseType: '专业课' },
        { studentId: 'S000002', courseId: 'C000003', courseName: '计算机网络', courseType: '公共课' },
        { studentId: 'S000003', courseId: 'C000002', courseName: '高等数学', courseType: '公共课' }
    ];

    document.addEventListener('DOMContentLoaded', loadRecords);

    function parseCsv(text) {
        return text.split(/\r?\n/)
            .map(line => line.trim())
            .filter(Boolean)
            .map(line => {
                const columns = line.split(',').map(item => item.trim());
                return {
                    studentId: columns[0] || '',
                    courseId: columns[1] || '',
                    courseName: columns[2] || '',
                    courseType: columns[3] || ''
                };
            })
            .filter(record => record.studentId && record.courseId && record.courseName);
    }

    async function importRecords() {
        const records = parseCsv(document.getElementById('csvInput').value);
        if (records.length === 0) {
            showMessage('请输入有效的 CSV 选课数据');
            return;
        }

        try {
            const result = await requestBackend('/import', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(records)
            });
            showMessage(result.message || '导入成功');
            await loadRecords();
        } catch (error) {
            showMessage('导入接口暂不可用，已展示页面样例数据');
            renderTable(sampleRecords);
        }
    }

    async function loadRecords() {
        const keyword = document.getElementById('keyword').value.trim();
        const courseType = document.getElementById('courseType').value;
        const params = new URLSearchParams();
        if (keyword) params.append('keyword', keyword);
        if (courseType) params.append('courseType', courseType);

        try {
            const result = await requestBackend(`/search?${params.toString()}`);
            const records = Array.isArray(result.data) ? result.data : [];
            showMessage(result.message || '查询成功');
            renderTable(records.length > 0 ? records : filterSampleRecords(keyword, courseType));
        } catch (error) {
            showMessage('查询接口暂不可用，当前展示页面样例数据');
            renderTable(filterSampleRecords(keyword, courseType));
        }
    }

    async function requestBackend(path, options = {}) {
        let lastError;
        for (const prefix of API_PREFIXES) {
            try {
                const response = await fetch(`${prefix}${path}`, options);
                if (!response.ok) {
                    lastError = new Error(`HTTP ${response.status}`);
                    continue;
                }
                return await response.json();
            } catch (error) {
                lastError = error;
            }
        }
        throw lastError;
    }

    function filterSampleRecords(keyword, courseType) {
        const lowerKeyword = keyword.toLowerCase();
        return sampleRecords.filter(record => {
            const keywordMatched = !keyword
                || record.studentId.toLowerCase().includes(lowerKeyword)
                || record.courseId.toLowerCase().includes(lowerKeyword)
                || record.courseName.toLowerCase().includes(lowerKeyword)
                || record.courseType.toLowerCase().includes(lowerKeyword);
            const typeMatched = !courseType || record.courseType === courseType;
            return keywordMatched && typeMatched;
        });
    }

    function renderTable(records) {
        const table = document.getElementById('recordTable');
        if (!records || records.length === 0) {
            table.innerHTML = '<tr><td class="empty" colspan="4">暂无选课数据</td></tr>';
            return;
        }

        table.innerHTML = records.map(record => `
            <tr>
                <td>${escapeHtml(record.studentId)}</td>
                <td>${escapeHtml(record.courseId)}</td>
                <td>${escapeHtml(record.courseName)}</td>
                <td><span class="tag">${escapeHtml(record.courseType || '未知类型')}</span></td>
            </tr>
        `).join('');
    }

    function showMessage(message) {
        document.getElementById('message').textContent = message;
    }

    function escapeHtml(value) {
        return String(value || '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }
</script>
</body>
</html>
